<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bodega 3D - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--md-primary:#4f46e5;--md-primary-light:#818cf8;--md-primary-dark:#4338ca;--md-secondary:#7c3aed;--md-warning:#d97706;--md-danger:#dc2626;--md-success:#16a34a;--md-surface:#0f0f0f;--md-surface-2:#1a1a1a;--md-surface-3:#242424;--md-bg:#0a0a0f;--md-text:#ffffff;--md-text-secondary:rgba(255,255,255,0.5);--md-text-muted:rgba(255,255,255,0.3);--md-border:rgba(255,255,255,0.08);--md-border-subtle:rgba(255,255,255,0.12);--md-radius:8px;--md-radius-sm:4px;--sidebar-w:240px;--kpi-h:64px;--right-panel-w:220px}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden;background:var(--md-bg);color:var(--md-text);font-family:'Inter','Roboto',sans-serif;font-size:14px}
    #app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--kpi-h) 1fr;width:100vw;height:100vh}
    #sidebar{grid-row:1/-1;background:var(--md-surface);border-right:1px solid var(--md-border);display:flex;flex-direction:column;overflow:hidden}
    .sidebar-logo{display:flex;align-items:center;gap:10px;padding:14px 12px;border-bottom:1px solid var(--md-border)}
    .logo-icon{width:36px;height:36px;border-radius:var(--md-radius);background:linear-gradient(135deg,var(--md-primary),var(--md-secondary));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
    .logo-text{font-size:15px;font-weight:700;color:var(--md-text);line-height:1.2}
    .logo-sub{font-size:10px;color:var(--md-text-muted);text-transform:uppercase;letter-spacing:.5px}
    .sidebar-search{padding:10px 10px 4px}
    .sidebar-search input{width:100%;padding:8px 10px;border-radius:var(--md-radius-sm);background:var(--md-surface-2);border:1px solid var(--md-border);color:var(--md-text);font-size:13px;outline:none}
    .sidebar-search input:focus{border-color:var(--md-primary)}
    .sidebar-search input::placeholder{color:var(--md-text-muted)}
    .sidebar-nav{flex:1;overflow-y:auto}
    .sidebar-nav::-webkit-scrollbar{width:4px}
    .sidebar-nav::-webkit-scrollbar-thumb{background:var(--md-border);border-radius:2px}
    .nav-aisle-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px 10px 10px}
    .nav-btn{background:var(--md-surface-2);border:1px solid var(--md-border);color:var(--md-text-secondary);border-radius:var(--md-radius-sm);padding:10px 6px;font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s;font-family:inherit}
    .nav-btn:hover{background:var(--md-surface-3);border-color:var(--md-border-subtle);color:var(--md-text)}
    .nav-btn.active{background:var(--md-primary);border-color:var(--md-primary);color:#fff}
    .nav-btn .nav-badge{font-size:9px;font-weight:400;opacity:.6}
    .nav-btn.zone-t{border-left:3px solid var(--md-warning)}
    .nav-btn.zone-a{border-left:3px solid var(--md-success)}
    .nav-btn.zone-p{border-left:3px solid var(--md-primary-light)}
    .nav-btn.zone-s{border-left:3px solid var(--md-secondary)}
    .sidebar-footer{padding:10px;border-top:1px solid var(--md-border);display:flex;flex-direction:column;gap:4px}
    .sidebar-footer .nav-btn{width:100%}
    #kpi-bar{grid-column:2;display:flex;align-items:stretch;background:var(--md-surface);border-bottom:1px solid var(--md-border);padding:0 12px;gap:1px}
    .kpi-card{display:flex;flex-direction:column;justify-content:center;padding:6px 16px;min-width:100px}
    .kpi-card+.kpi-card{border-left:1px solid var(--md-border)}
    .kpi-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--md-text-secondary)}
    .kpi-value{font-size:22px;font-weight:700;margin-top:1px}
    .kpi-blue .kpi-value{color:#60a5fa}.kpi-green .kpi-value{color:#4ade80}.kpi-amber .kpi-value{color:#fbbf24}.kpi-red .kpi-value{color:#f87171}
    .kpi-actions{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 8px}
    #main-area{grid-column:2;grid-row:2;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr var(--right-panel-w)}
    #scene-container{position:relative;overflow:hidden}
    #right-panel{background:var(--md-surface);border-left:1px solid var(--md-border);overflow-y:auto;padding:10px}
    .md-card{background:var(--md-surface-2);border:1px solid var(--md-border);border-radius:var(--md-radius);padding:10px;margin-bottom:10px}
    .card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--md-text-secondary);margin-bottom:8px}
    .floating-panel{position:absolute;z-index:100;pointer-events:auto;background:rgba(15,15,15,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--md-border-subtle);border-radius:var(--md-radius);box-shadow:0 8px 32px rgba(0,0,0,.5);min-width:240px;max-width:360px;display:none}
    .floating-panel.visible{display:block}
    .floating-panel-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--md-border)}
    .floating-panel-title{font-size:12px;font-weight:600;color:var(--md-text-secondary)}
    .floating-panel-close{background:none;border:none;color:var(--md-text-muted);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
    .floating-panel-body{padding:10px 12px;max-height:320px;overflow-y:auto}
    .mono{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--md-primary-light)}
    .estado-badge{font-size:10px;font-weight:700;padding:2px 10px;border-radius:10px;text-transform:uppercase}
    .estado-liberado{background:rgba(37,99,235,.2);color:#60a5fa}
    .estado-retenido{background:rgba(217,119,6,.2);color:#fbbf24}
    .estado-rechazado{background:rgba(220,38,38,.2);color:#f87171}
    .stats-metric-row{display:flex;gap:16px;margin-bottom:8px}
    .stats-metric{flex:1;text-align:center}
    .stats-metric-value{font-size:22px;font-weight:700;color:var(--md-primary-light)}
    .stats-metric-label{font-size:10px;color:var(--md-text-muted);text-transform:uppercase;letter-spacing:.5px}
    .stats-lote-row{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;font-size:11px;border-radius:var(--md-radius-sm)}
    .stats-lote-row:hover{background:rgba(255,255,255,.03)}
    .stats-lote-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--md-text-secondary)}
    .stats-lote-meta{display:flex;gap:8px;flex-shrink:0}
    .stats-lote-ubics{color:var(--md-text-muted);font-size:10px}
    .stats-lote-qty{font-weight:600}
    .stats-no-data{font-size:11px;color:var(--md-text-muted);padding:4px}
    .stats-ubics-grid{display:flex;flex-wrap:wrap;gap:4px}
    .stats-ubic-tag{font-size:10px;padding:2px 8px;background:rgba(255,255,255,.04);border:1px solid var(--md-border);border-radius:10px;color:var(--md-text-secondary)}
    #search-suggestions{position:absolute;top:100%;left:0;right:0;z-index:200;background:var(--md-surface-2);border:1px solid var(--md-border-subtle);border-radius:var(--md-radius-sm);max-height:240px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
    #search-suggestions.visible{display:block}
    #search-suggestions button{display:block;width:100%;text-align:left;padding:8px 10px;background:none;border:none;color:var(--md-text);font-size:12px;cursor:pointer;font-family:inherit}
    #search-suggestions button:hover{background:rgba(255,255,255,.04)}
    #zone-occupancy{position:absolute;bottom:12px;right:8px;z-index:50;pointer-events:auto;background:rgba(15,15,15,.85);backdrop-filter:blur(8px);border:1px solid var(--md-border);border-radius:var(--md-radius);min-width:200px;display:none}
    #zone-occupancy.visible{display:block}
    .zone-item{margin:6px 0}
    .zone-label-row{display:flex;justify-content:space-between;font-size:10px;color:var(--md-text-secondary);margin-bottom:2px}
    .zone-stats{font-family:'JetBrains Mono',monospace;font-size:10px}
    .zone-bar{height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
    .zone-bar-fill{height:100%;border-radius:2px;transition:width .5s}
    .zo-primary .zone-bar-fill{background:var(--md-primary)}
    .zo-cava .zone-bar-fill{background:#06b6d4}
    .zo-t .zone-bar-fill{background:var(--md-warning)}
    .zo-a .zone-bar-fill{background:var(--md-success)}
    .zo-p .zone-bar-fill{background:var(--md-primary-light)}
    .zo-s .zone-bar-fill{background:var(--md-secondary)}
    #loading-overlay{position:absolute;top:0;left:0;right:0;bottom:0;z-index:999;pointer-events:none;display:flex;align-items:center;justify-content:center;background:rgba(10,10,15,.8);transition:opacity .5s}
    #loading-overlay.hidden{opacity:0}
    #loading-content{text-align:center;color:var(--md-primary-light)}
    #loading-content .spinner{width:40px;height:40px;border:3px solid var(--md-border);border-top-color:var(--md-primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
    @keyframes spin{to{transform:rotate(360deg)}}
    #loading-text{font-size:14px;font-weight:500}
    #loading-progress{font-size:11px;color:var(--md-text-muted);margin-top:4px}
    .donut-placeholder{display:flex;justify-content:center;margin-bottom:8px}
    .status-list{display:flex;flex-direction:column;gap:4px}
    .status-row{display:flex;align-items:center;gap:6px;font-size:11px;padding:3px 6px;border-radius:var(--md-radius-sm);cursor:pointer}
    .status-row:hover{background:rgba(255,255,255,.03)}
    .status-row.active{background:rgba(79,70,229,.15)}
    .status-label{width:55px;color:var(--md-text-secondary);flex-shrink:0}
    .status-bar{flex:1;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
    .bar-fill{height:100%;border-radius:2px;transition:width .3s}
    .status-qty{width:24px;text-align:right;font-weight:600;color:var(--md-text);font-size:12px}
    #top-products-list{display:flex;flex-direction:column;gap:3px}
    .top-product-row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:var(--md-radius-sm);font-size:12px}
    .top-product-row:hover{background:rgba(255,255,255,.03)}
    .top-product-idx{color:var(--md-text-muted);font-size:10px;width:16px}
    .top-product-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
    .top-product-count{font-weight:700;color:var(--md-primary-light);font-family:'JetBrains Mono',monospace;font-size:11px}
    #controls-legend{position:absolute;bottom:12px;left:12px;z-index:50;background:rgba(15,15,15,.85);backdrop-filter:blur(8px);border:1px solid var(--md-border);border-radius:var(--md-radius);padding:8px 12px;font-size:10px;color:var(--md-text-muted);pointer-events:auto}
    #reset-view-btn{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);z-index:50;pointer-events:auto;background:rgba(15,15,15,.85);backdrop-filter:blur(8px);border:1px solid var(--md-border);border-radius:20px;padding:6px 16px;font-size:12px;color:var(--md-text-secondary);cursor:pointer;font-family:inherit;font-weight:500;display:none}
    #reset-view-btn:hover{background:var(--md-surface-2);color:var(--md-text)}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--md-border);border-radius:2px}
  </style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">3D</div>
      <div><div class="logo-text">Bodega 3D</div><div class="logo-sub">Control de Operaciones</div></div>
    </div>
    <div class="sidebar-search" id="search-container">
      <div style="display:flex;gap:4px">
        <input type="text" id="search-input" placeholder="Buscar producto o lote..." autocomplete="off" />
        <button id="search-clear" style="display:none;background:rgba(255,255,255,.06);border:1px solid var(--md-border);color:#94a3b8;padding:0 10px;border-radius:4px;cursor:pointer;font-size:13px;font-family:inherit">✕</button>
      </div>
      <div id="search-suggestions"></div>
    </div>
    <div class="sidebar-nav">
      <div style="font-size:10px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:1px;padding:12px 10px 6px">Pasillos</div>
      <div class="nav-aisle-grid" id="pasillo-buttons"></div>
    </div>
    <div class="sidebar-footer">
      <button class="nav-btn" id="reset-view-btn-sidebar">Reset Vista</button>
    </div>
  </aside>
  <div id="kpi-bar">
    <div class="kpi-card kpi-blue"><div class="kpi-label">Total Ubicaciones</div><div class="kpi-value" id="kpi-total">--</div></div>
    <div class="kpi-card kpi-green"><div class="kpi-label">Ocupación</div><div class="kpi-value" id="kpi-ocupacion">--</div></div>
    <div class="kpi-card kpi-amber"><div class="kpi-label">Retenidos</div><div class="kpi-value" id="kpi-retenidos">--</div></div>
    <div class="kpi-card kpi-red"><div class="kpi-label">Rechazados</div><div class="kpi-value" id="kpi-rechazados">--</div></div>
    <div class="kpi-actions"><button class="nav-btn" id="reload-btn" style="font-size:11px;padding:6px 12px">↻ Recargar</button></div>
  </div>
  <div id="main-area">
    <div id="scene-container">
      <div id="loading-overlay"><div id="loading-content"><div class="spinner"></div><div id="loading-text">Cargando modelo 3D...</div><div id="loading-progress"></div></div></div>
      <div class="floating-panel" id="info-panel">
        <div class="floating-panel-header"><span class="floating-panel-title"><span class="mono" id="rack-id-display">-</span></span><button class="floating-panel-close" id="info-close">✕</button></div>
        <div class="floating-panel-body" id="info-body"></div>
      </div>
      <div class="floating-panel" id="stats-panel">
        <div class="floating-panel-header"><span class="floating-panel-title">Estadísticas</span><button class="floating-panel-close" id="stats-close">✕</button></div>
        <div class="floating-panel-body" id="stats-body"></div>
      </div>
      <button id="reset-view-btn">⟲ Reset Vista</button>
      <div id="zone-occupancy"><div class="card-title" style="padding:8px 12px 0">Ocupación por Zona</div><div style="padding:4px 12px 12px" id="zone-occupancy-body"></div></div>
      <div id="controls-legend"><div>🖱 Click: seleccionar rack</div><div>🖱 Mantener: estadísticas</div><div>🔄 Scroll/Drag: orbitar</div></div>
    </div>
    <div id="right-panel">
      <div class="md-card">
        <div class="card-title">Estado</div>
        <div class="donut-placeholder"><svg width="80" height="80" viewBox="0 0 80 80" style="transform:rotate(-90deg);transform-origin:center" id="donut-svg"><circle cx="40" cy="40" r="33" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="6" stroke-dasharray="207.345 0" stroke-dashoffset="0" stroke-linecap="butt"/></svg></div>
        <div class="status-list" id="donut-status-list"></div>
      </div>
      <div class="md-card"><div class="card-title">Top Productos</div><div id="top-products-list"></div></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ─── CONFIG ────────────────────────────────────────────────
var MODEL_URL='https://raw.githubusercontent.com/kscerero-png/warehouse-viewer/master/docs/almacen.glb';

// ─── UTILITIES ─────────────────────────────────────────────
function isTransitId(id){return/^T\d{2}$/.test(id)}
function isFormulacionId(id){return/^A\d{3}$/.test(id)}
function isGalponAnexoId(id){return/^P\d{2}$/.test(id)}
function isJaulaId(id){return/^SQ\d{2}$/.test(id)}
function isRackId(id){return/^[1-9]/.test(id)||isTransitId(id)||isFormulacionId(id)||isGalponAnexoId(id)||isJaulaId(id)}
function isSubPaletaName(n){return/^(T\d{2}|A\d{3}|P\d{2}|SQ\d{2})-\d+$/.test(n)}
function isFiveDigitId(id){return/^\d{5}$/.test(id)}
function getEntriesForId(id,d){return d.filter(function(i){return i.id===id})}
function mergeEntryState(e){var r='liberado';for(var i=0;i<e.length;i++){var s=e[i].estado||'liberado';if(s==='rechazado')return'rechazado';if(s==='retenido')r='retenido'}return r}
function groupEntries(e){var g={};e.forEach(function(x){var k=((x.producto||'').trim()+'|'+(x.codigo||'').trim())||'u';if(!g[k])g[k]={producto:(x.producto||'').trim(),codigo:(x.codigo||'').trim(),lotes:[],paletas:0,cantidad:0,um:x.um||''};g[k].lotes.push({lote:x.lote||'-',cantidad:parseFloat(String(x.cantidad))||0});g[k].paletas+=parseFloat(String(x.paletas))||0;g[k].cantidad+=parseFloat(String(x.cantidad))||0});return Object.values(g).map(function(x){x.lotes=function(l){var m={};l.forEach(function(y){var lk=(y.lote||'-').trim()||'-';if(!m[lk])m[lk]={lote:lk,cantidad:0};m[lk].cantidad+=y.cantidad});return Object.keys(m).map(function(k){return m[k]})}(x.lotes);return x})}
function calculateStatusBreakdown(e,zf,tr,p){var z=zf?e.filter(function(x){return zf(x.id)}):e;if(p==='T'||p==='P'){var ret=0,rej=0,lib=0;for(var i=0;i<z.length;i++){var x=z[i],pa=parseFloat(String(x.paletas))||0,oc=pa>0||(parseFloat(String(x.cantidad))||0)>0;if(!oc)continue;var st=(x.estado||'liberado').toLowerCase(),cnt=pa>0?pa:1;if(st==='retenido')ret+=cnt;else if(st==='rechazado')rej+=cnt;else lib+=cnt}var va=tr-ret-rej-lib,tt=tr||1;return{retenido:ret,rechazado:rej,liberado:lib,vacio:Math.max(0,va),pctRetenido:Math.round(ret/tt*100),pctRechazado:Math.round(rej/tt*100),pctLiberado:Math.round(lib/tt*100),pctVacio:Math.round(Math.max(0,va)/tt*100)}}
if(p==='A'||p==='S'){var pm={};for(var i=0;i<z.length;i++){var x=z[i];if(!pm[x.id])pm[x.id]=[];pm[x.id].push(x)}var tsp=tr,oc=0,ret=0,rej=0,lib=0;for(var id in pm){var pe=pm[id],ac=0,pc=0;for(var j=0;j<pe.length;j++){var pp=parseFloat(String(pe[j].paletas))||0;if(pp<=0)continue;var na=ac+pp,es=(pe[j].estado||'liberado').toLowerCase();if(pc<1&&ac<1&&na>=1){if(es==='retenido')ret++;else if(es==='rechazado')rej++;else lib++;pc++;oc++}if(pc<2&&ac<2&&na>=2){if(es==='retenido')ret++;else if(es==='rechazado')rej++;else lib++;pc++;oc++}if(pc>=2)break;ac=na}}var va=tsp-oc,tt=tsp||1;return{retenido:ret,rechazado:rej,liberado:lib,vacio:Math.max(0,va),pctRetenido:Math.round(ret/tt*100),pctRechazado:Math.round(rej/tt*100),pctLiberado:Math.round(lib/tt*100),pctVacio:Math.round(Math.max(0,va)/tt*100)}}

function uSug(){var term=searchInput.value;if(!term.trim()){searchSug.classList.remove('visible');searchSug.innerHTML='';return}var t=term.toLowerCase().trim(),seen={},results=[];for(var i=0;i<AppState.datosInventario.length;i++){var item=AppState.datosInventario[i];if(AppState.pasilloSeleccionado!=='todos'){var pd=item.id[0];if(AppState.pasilloSeleccionado==='T'&&!/^T\d{2}$/.test(item.id))continue;else if(AppState.pasilloSeleccionado==='A'&&!/^A\d{3}$/.test(item.id))continue;else if(AppState.pasilloSeleccionado==='P'&&!/^P\d{2}$/.test(item.id))continue;else if(AppState.pasilloSeleccionado==='S'&&!/^SQ\d{2}$/.test(item.id))continue;else if(/^\d+$/.test(AppState.pasilloSeleccionado)&&pd!==AppState.pasilloSeleccionado)continue}var prod=(item.producto||'').toLowerCase(),cod=(item.codigo||'').toLowerCase();if(prod.includes(t)||cod.includes(t)){var key=item.producto+'|'+item.codigo;if(!seen[key]){seen[key]=1;results.push({id:item.id,producto:item.producto,codigo:item.codigo});if(results.length>=20)break}}}if(results.length>0){searchSug.innerHTML=results.map(function(s){return'<button data-prod="'+escapeHtml(s.producto)+'" data-cod="'+escapeHtml(s.codigo||'')+'"><strong>'+escapeHtml(s.producto)+'</strong>'+(s.codigo?'<span style="color:#64748b"> — '+escapeHtml(s.codigo)+'</span>':'')+'</button>'}).join('');searchSug.classList.add('visible')}else{searchSug.innerHTML='<div class="no-result">Sin resultados</div>';searchSug.classList.add('visible')}}

// ─── INIT ──────────────────────────────────────────────────
var sceneManager=null;
document.getElementById('info-close').addEventListener('click',function(){AppState.clearSelection();renderAll()});
document.getElementById('stats-close').addEventListener('click',function(){AppState.setProductStats(null);renderAll()});
document.getElementById('reload-btn').addEventListener('click',function(){loadData()});
document.getElementById('reset-view-btn').addEventListener('click',function(){resetAll()});
document.getElementById('reset-view-btn-sidebar').addEventListener('click',function(){resetAll()});
function resetAll(){AppState.resetAll();if(sceneManager){sceneManager.pasilloSeleccionado='todos';sceneManager.currentSearchTerm='';sceneManager.currentStatusFilter=null;sceneManager.applySearchFilter()}renderAll();searchInput.value='';searchClear.style.display='none'}

function loadData(){
  var lt=document.getElementById('loading-text'),lp=document.getElementById('loading-progress');
  lt.textContent='Cargando datos del inventario...';lp.textContent='';
  google.script.run
    .withSuccessHandler(function(data){
      if(Array.isArray(data)){
        var mapped=data.map(normalizeEntry).filter(function(e){return e.id&&isRackId(e.id)});
        AppState.setInventario(mapped);
        if(sceneManager&&sceneManager.modelReady){sceneManager.updateSceneFromInventario(mapped);var counts=sceneManager.getRackCountsByZone();AppState.setRackCounts(counts)}
        renderAll();lt.textContent='Modelo y datos cargados';setTimeout(function(){document.getElementById('loading-overlay').classList.add('hidden')},500)
      }
    })
    .withFailureHandler(function(err){
      lt.textContent='Error al cargar: '+err.message;lp.textContent='Reintentando...';
      setTimeout(loadData,3000)
    })
    .getInventoryData();
}

function init(){
  initMaterials();var c=document.getElementById('scene-container');sceneManager=new SceneManager(c);
  sceneManager.onMeshClick=function(entries){AppState.setSelectedRack(entries,entries[0]?entries[0].id:null);renderAll()};
  sceneManager.onMeshLongPress=function(entries,prod,cod){var stats=computeProductStats(prod,cod,AppState.datosInventario);if(stats)AppState.setProductStats(stats);renderAll()};
  sceneManager.onModelLoaded=function(){var d=AppState.datosInventario;if(d.length>0){sceneManager.updateSceneFromInventario(d);var counts=sceneManager.getRackCountsByZone();AppState.setRackCounts(counts);renderAll()}document.getElementById('reset-view-btn').style.display='block'};
  sceneManager.onLoaderUpdate=function(pct,show){document.getElementById('loading-progress').textContent=show?Math.round(pct*100)+'%':''};
  sceneManager.loadModel(MODEL_URL).then(function(){document.getElementById('loading-text').textContent='Cargando inventario...';loadData()}).catch(function(err){document.getElementById('loading-text').textContent='Error al cargar el modelo 3D';document.getElementById('loading-progress').textContent=err.message||'Error de conexión'});
  AppState.on('selection',renderAll);AppState.on('stats',renderAll);AppState.on('metrics',renderAll);renderAll()
}
window.addEventListener('DOMContentLoaded',init);
</script>
