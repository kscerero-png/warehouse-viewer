<!DOCTYPE html>
<html>
  <head>
    <base target="_parent" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #060b11;
        color: #e2e8f0;
        overflow: hidden;
      }
      #loading-overlay {
        position: fixed;
        inset: 0;
        background: #060b11;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: opacity 0.3s;
      }
      #loading-overlay.hidden { opacity: 0; pointer-events: none; }
      #loading-content {
        text-align: center;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top: 3px solid #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 12px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #loading-text {
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 8px;
      }
      #loading-progress {
        font-size: 11px;
        color: #64748b;
      }

      /* Sidebar */
      #sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        width: 240px;
        background: rgba(15,15,15,.95);
        backdrop-filter: blur(12px);
        border-right: 1px solid rgba(255,255,255,.06);
        display: flex;
        flex-direction: column;
        z-index: 100;
        padding: 0;
      }
      .sidebar-logo {
        padding: 20px;
        border-bottom: 1px solid rgba(255,255,255,.06);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo-icon {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #2563eb, #06b6d4);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 16px;
        color: white;
      }
      .logo-text {
        font-size: 15px;
        font-weight: 600;
        color: #e2e8f0;
        margin-bottom: 2px;
      }
      .logo-sub {
        font-size: 11px;
        color: #94a3b8;
        font-weight: 400;
      }

      #search-container {
        position: relative;
        margin: 16px;
        background: rgba(15,15,15,.6);
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 8px;
        backdrop-filter: blur(8px);
      }
      #search-input {
        width: 100%;
        height: 36px;
        background: transparent;
        border: none;
        color: #e2e8f0;
        padding: 0 12px;
        font-size: 13px;
        outline: none;
      }
      #search-input::placeholder { color: #64748b; }
      #search-clear {
        position: absolute;
        right: 8px; top: 50%;
        transform: translateY(-50%);
        background: rgba(255,255,255,.06);
        border: 1px solid rgba(255,255,255,.12);
        color: #94a3b8;
        border-radius: 4px;
        padding: 2px 8px;
        cursor: pointer;
        font-size: 12px;
        display: none;
      }
      #search-clear:hover { background: rgba(239,68,68,.2); color: #f87171; }
      #search-suggestions {
        position: absolute;
        top: 100%;
        left: 0; right: 0;
        margin-top: 4px;
        background: rgba(15,15,15,.98);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 8px;
        max-height: 240px;
        overflow-y: auto;
        z-index: 200;
        box-shadow: 0 8px 24px rgba(0,0,0,.5);
        display: none;
      }
      #search-suggestions.visible { display: block; }
      #search-suggestions button {
        width: 100%;
        text-align: left;
        padding: 8px 12px;
        background: none;
        border: none;
        color: #e2e8f0;
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
      }
      #search-suggestions button:hover { background: rgba(255,255,255,.04); }
      #search-suggestions strong { color: #60a5fa; font-weight: 600; }
      #search-suggestions .no-result {
        padding: 10px;
        color: #94a3b8;
        font-size: 12px;
        text-align: center;
      }

      .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
      }
      .nav-aisle-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 0 8px;
      }
      .nav-btn {
        aspect-ratio: 1;
        background: rgba(15,15,15,.6);
        border: 1px solid rgba(255,255,255,.08);
        color: #e2e8f0;
        border-radius: 6px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 500;
        transition: all 0.15s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 6px 4px;
      }
      .nav-btn:hover { background: rgba(37,99,235,.2); border-color: rgba(37,99,235,.4); }
      .nav-btn.active {
        background: rgba(37,99,235,.3);
        border-color: rgba(37,99,235,.6);
        color: #93c5fd;
        font-weight: 600;
      }
      .nav-badge {
        font-size: 9px;
        background: rgba(255,255,255,.08);
        padding: 1px 4px;
        border-radius: 3px;
        color: #94a3b8;
      }
      .nav-btn.active .nav-badge {
        background: rgba(37,99,235,.4);
        color: #93c5fd;
      }

      .sidebar-footer {
        padding: 16px;
        border-top: 1px solid rgba(255,255,255,.06);
        background: rgba(15,15,15,.7);
      }
      .sidebar-actions {
        display: flex;
        gap: 8px;
      }
      .sidebar-actions button {
        flex: 1;
        height: 32px;
        background: rgba(37,99,235,.2);
        border: 1px solid rgba(37,99,235,.4);
        color: #93c5fd;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        transition: all 0.15s;
      }
      .sidebar-actions button:hover {
        background: rgba(37,99,235,.3);
        border-color: rgba(37,99,235,.6);
        box-shadow: 0 0 8px rgba(37,99,235,.3);
      }

      /* Main Area */
      #main-area {
        margin-left: 240px;
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr var(--right-panel-w);
        position: relative;
        overflow: hidden;
      }
      #scene-container {
        position: relative;
        overflow: hidden;
      }

      /* KPI Bar */
      #kpi-bar {
        position: fixed;
        left: 240px; right: var(--right-panel-w);
        top: 0; height: 68px;
        background: rgba(15,15,15,.92);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255,255,255,.06);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        z-index: 50;
      }
      .kpi-card {
        flex: 1;
        background: rgba(15,15,15,.6);
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 10px;
        padding: 10px 12px;
        min-height: 56px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .kpi-label {
        font-size: 10px;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: .8px;
        margin-bottom: 4px;
        font-weight: 500;
      }
      .kpi-value {
        font-size: 18px;
        font-weight: 600;
        color: #e2e8f0;
      }
      .kpi-progress {
        margin-top: 6px;
        height: 3px;
        background: rgba(255,255,255,.06);
        border-radius: 2px;
        overflow: hidden;
      }
      .kpi-progress-fill {
        height: 100%;
        background: #10b981;
        transition: width 0.3s ease;
      }
      .kpi-split {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 4px;
      }
      .kpi-split-item {
        text-align: center;
        padding: 2px 4px;
        background: rgba(255,255,255,.05);
        border-radius: 4px;
        font-size: 10px;
      }
      .kpi-split-unit {
        font-size: 8px;
        color: #64748b;
        display: block;
        margin-bottom: 1px;
      }
      .kpi-split-val {
        font-weight: 600;
        color: #e2e8f0;
      }
      .kpi-actions {
        margin-left: auto;
        padding-left: 12px;
      }
      .kpi-actions button {
        height: 28px;
        padding: 0 12px;
        background: rgba(37,99,235,.2);
        border: 1px solid rgba(37,99,235,.4);
        color: #93c5fd;
        border-radius: 6px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 500;
      }

      /* Floating Panels */
      .floating-panel {
        position: absolute;
        z-index: 100;
        pointer-events: auto;
        background: rgba(15,15,15,.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,.12);
        border-radius: var(--md-radius);
        box-shadow: 0 8px 32px rgba(0,0,0,.5);
        width: 280px;
        display: none;
      }
      .floating-panel.visible { display: block; }
      .floating-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid rgba(255,255,255,.08);
      }
      .floating-panel-title {
        font-size: 12px;
        font-weight: 600;
        color: #e2e8f0;
      }
      .floating-panel-close {
        background: none;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        font-size: 14px;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .floating-panel-close:hover { background: rgba(239,68,68,.2); color: #f87171; }
      .floating-panel-body {
        padding: 12px;
        max-height: 320px;
        overflow-y: auto;
      }
      .mono {
        font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
        font-size: 12px;
        color: #60a5fa;
      }

      /* Right Panel */
      #right-panel {
        background: var(--md-surface);
        border-left: 1px solid var(--md-border);
        overflow-y: auto;
        padding: 16px;
        width: var(--right-panel-w);
        position: relative;
      }
      .md-card {
        background: var(--md-surface-2);
        border: 1px solid var(--md-border-subtle);
        border-radius: var(--md-radius);
        padding: 12px;
        margin-bottom: 12px;
      }
      .card-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .8px;
        color: var(--md-text-secondary);
        margin-bottom: 8px;
      }
      .product-summary-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid rgba(255,255,255,.04);
      }
      .product-summary-row:last-child { border-bottom: none; }
      .prod-name {
        flex: 1;
        font-size: 12px;
        color: #e2e8f0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .prod-qty {
        font-size: 11px;
        color: #60a5fa;
        font-weight: 600;
        margin: 0 8px;
        min-width: 30px;
        text-align: right;
      }
      .badge-estado {
        font-size: 9px;
        padding: 2px 6px;
        border-radius: 10px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: .3px;
      }
      .badge-retenido { background: rgba(251,146,60,.2); color: #fdba74; border: 1px solid rgba(251,146,60,.4); }
      .badge-rechazado { background: rgba(239,68,68,.2); color: #f87171; border: 1px solid rgba(239,68,68,.4); }
      .badge-liberado { background: rgba(34,197,94,.2); color: #86efac; border: 1px solid rgba(34,197,94,.4); }
      .prod-ubics {
        font-size: 10px;
        color: #64748b;
      }

      /* Zone Occupancy */
      #zone-occupancy {
        position: absolute;
        bottom: 12px;
        right: calc(var(--right-panel-w) + 12px);
        z-index: 50;
        pointer-events: auto;
        background: rgba(15,15,15,.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--md-border-subtle);
        border-radius: var(--md-radius);
        min-width: 230px;
        display: none;
        box-shadow: 0 8px 32px rgba(0,0,0,.5);
      }
      #zone-occupancy.visible { display: block; }
      .zone-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid rgba(255,255,255,.04);
      }
      .zone-item:last-child { border-bottom: none; }
      .zone-label-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .zone-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #e2e8f0;
        font-weight: 500;
      }
      .zone-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #64748b;
        display: inline-block;
      }
      .zone-stats {
        font-size: 11px;
        color: #94a3b8;
      }
      .zone-bar {
        height: 4px;
        background: rgba(255,255,255,.04);
        border-radius: 2px;
        margin-top: 6px;
        overflow: hidden;
      }
      .zone-bar-fill {
        height: 100%;
        background: #60a5fa;
        transition: width 0.3s ease;
      }

      /* Status filter clear button */
      #usage-status-clear {
        background: rgba(239,68,68,.2);
        border: 1px solid rgba(239,68,68,.4);
        color: #f87171;
        font-size: 11px;
        padding: 4px 10px;
        margin-left: auto;
        border-radius: 6px;
        cursor: pointer;
      }

      /* Right panel cards */
      #zone-products-card, #status-products-card {
        display: none;
        max-height: 320px;
        overflow-y: auto;
      }
      .stats-empty {
        text-align: center;
        padding: 16px;
        color: #94a3b8;
        font-size: 12px;
      }

      :root {
        --md-surface: #0f172a;
        --md-surface-2: #1e293b;
        --md-border: #334155;
        --md-border-subtle: #475569;
        --md-text: #e2e8f0;
        --md-text-muted: #94a3b8;
        --md-text-secondary: #cbd5e1;
        --md-primary: #2563eb;
        --md-primary-light: #93c5fd;
        --md-radius: 12px;
        --md-radius-sm: 6px;
        --right-panel-w: 320px;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  </head>
  <body>
    <div id="loading-overlay">
      <div id="loading-content">
        <div class="spinner"></div>
        <div id="loading-text">Cargando modelo 3D...</div>
        <div id="loading-progress"></div>
      </div>
    </div>
    <script>
      // GLOBAL CONFIGURATION
       var CONFIG = {
         modelUrl: 'https://cdn.jsdelivr.net/gh/anomalyco/warehouse-3d@mf/docs/almacen.glb',
         inventarioUrl: 'https://script.google.com/macros/s/AKfycbxJthmAczBij7ilAhDQF8ylNpUEs1WreP-oTBe03xRuV6VCAF3WbM79YD6u_ZjhUuqC/exec'
       };

       // ─── CORE APPS SCRIPT BACKEND ─────────────────────────────────────────────
       var APPS = {
        // ─── MATERIAL SYSTEM ───────────────────────────────────────────
        MATERIALS: (function() {
          var mats = {};
          mats.greyMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.6, metalness: 0.1 });
          mats.okMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.5, metalness: 0.1 });
          mats.retenidoMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.5, metalness: 0.1 });
          mats.rechazadoMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.5, metalness: 0.1 });
          mats.GROUP_COLORS = {
            QS: 0x1e3a8a, ALG: 0x059669, CRR: 0x92400e, MZ04: 0x7c3aed, MZ80: 0xdb2777,
            BCH: 0x0891b2, PT: 0x16a34a, 'A&G': 0xca8a04, MP: 0x6366f1, VAR: 0x6b7280,
            ME: 0x475569, BS: 0xdc2626, LAM: 0xea580c, 'T&S': 0x9333ea, CEM: 0x64748b,
            ENV: 0x0d9488, CLP: 0x7c2d12, PR: 0xbe123c
          };
          function hashColor(s) {
            var h = 0;
            for (var i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
            var hue = ((h % 360) + 360) % 360;
            return hslToHex(hue, 60, 40);
          }
          function hslToHex(h, s, l) {
            s /= 100; l /= 100;
            var k = function(n) { return (n + h / 30) % 12; };
            var a = s * Math.min(l, 1 - l);
            var f = function(n) { return Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))))); };
            return (f(0) << 16) | (f(8) << 8) | f(4);
          }

          function getGroupColor(g) {
            if (!g) return 0x444444;
            return mats.GROUP_COLORS[g] || hashColor(g);
          }

          function getRackMaterial(ud, bc, vm, grupo) { if (vm === 'grupo' && grupo) {
              var c = getGroupColor(grupo);
              return new THREE.MeshStandardMaterial({ color: c, roughness: 0.5, metalness: 0.1 });
            }
            if (!ud || !ud.estado) return mats.greyMat;
            var es = ud.estado.toLowerCase();
            if (ud.entries && ud.entries.length > 1) {
              var colors = ud.entries.map(function(e) {
                var st = (e.estado || 'liberado').toLowerCase();
                if (st === 'rechazado') return 0xdc2626;
                if (st === 'retenido') return 0xd97706;
                return 0x2563eb;
              });
              return new THREE.MeshStandardMaterial({
                map: getMultiColorTexture(colors, 64, 64),
                roughness: 0.5,
                metalness: 0.1,
              });
            }
            if (es === 'retenido') return mats.retenidoMat;
            if (es === 'rechazado') return mats.rechazadoMat;
            if (bc) return new THREE.MeshStandardMaterial({ color: bc, roughness: 0.6, metalness: 0.1 });
            return mats.okMat;
          }

          function getMultiColorTexture(colors, w, h) {
            var canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            var ctx = canvas.getContext('2d');
            var bandW = w / colors.length;
            colors.forEach(function(c, i) {
              ctx.fillStyle = '#' + c.toString(16).padStart(6, '0');
              ctx.fillRect(i * bandW, 0, bandW, h);
            });
            return new THREE.CanvasTexture(canvas);
          }

          mats.getRackMaterial = getRackMaterial;
          mats.getMultiColorTexture = getMultiColorTexture;

          return mats;
        })(),

        // ─── INVENTORY NORMALIZE ─────────────────────────────────────────────
        normalizeEntry: function(r) {
          if (!r) return r;
          var e = (r.estado || r.Estado || r.ESTADO || r.lote_estado || '').toString().trim().toUpperCase();
          if (e === 'R' || e === 'RETENIDO') e = 'retenido';
          else if (e === 'X' || e === 'RECHAZADO') e = 'rechazado';
          else e = 'liberado';
          var pal = parseFloat(r.paletas || r.Paletas || r.PALETAS || 0) || 0;
          var um = String(r.um || r.UM || r.Um || r.Unidad || '').trim().toLowerCase();
          var cant = parseFloat(r.cantidad || r.Cantidad || r.CANTIDAD || 0) || 0;
          if (pal === 0 && um === 'bp' && cant > 0) pal = cant / 4;
          return {
            id: String(r.id || r.ID || r.Ubicacion || '').trim(),
            producto: String(r.producto || r.Producto || r.PRODUCTO || '').trim(),
            codigo: String(r.codigo || r.Codigo || r.CODIGO || '').trim(),
            lote: String(r.lote || r.Lote || r.LOTE || '').trim(),
            cantidad: cant,
            um: um,
            estado: e,
            paletas: pal,
            nivel: parseFloat(r.nivel || r.Nivel || r.NIVEL || 0) || 0,
            nomenclatura: String(r.Nomenclatura || r.nomenclatura || '').trim() || undefined,
            grupo: String(r.Grupo || r.grupo || '').trim() || undefined
          };
        },

        // ─── STATE MANAGEMENT ───────────────────────────────────────────────
        State: {
          data: [],
          pasilloSeleccionado: 'todos',
          currentStatusFilter: null,
          searchQuery: '',
          selectedRack: null,
          selectedRackId: null,
          productStats: null,
          rackCounts: {},
          zoneMetrics: {},
          statusBreakdown: { retenido: 0, rechazado: 0, liberado: 0, vacio: 0, pctRetenido: 0, pctRechazado: 0, pctLiberado: 0, pctVacio: 0 },
          topProducts: [],
          viewMode: 'ocupacion',
          listeners: {},

          on: function(event, fn) {
            if (!this.listeners[event]) this.listeners[event] = [];
            this.listeners[event].push(fn);
            return function() {
              APPS.State.listeners[event] = APPS.State.listeners[event].filter(function(f) { return f !== fn; });
            };
          },

          emit: function(event) {
            var fns = this.listeners[event] || [];
            for (var i = 0; i < fns.length; i++) fns[i](this);
          },

          setInventario: function(data) {
            this.data = data;
            this.updateMetrics();
            this.emit('inventario');
          },

          setPasillo: function(p) {
            this.pasilloSeleccionado = p;
            this.updateMetrics();
            this.emit('pasillo');
          },

          setStatusFilter: function(f) { this.currentStatusFilter = f; this.emit('statusFilter'); },

        getEffectivePositions: function(entry) {

        calculateStatusBreakdown: function(entries, zoneFilter, totalRacks, pasillo) {
          var zone = zoneFilter ? entries.filter(function(e) { return zoneFilter(e.id); }) : entries;
          var isCapacityZone = pasillo === 'T' || pasillo === 'P';
          if (isCapacityZone) {
            var ret = 0, rej = 0, lib = 0;
            for (var i = 0; i < zone.length; i++) {
              var e = zone[i];
              var p = parseFloat(String(e.paletas)) || 0;
              var ocupado = p > 0 || (parseFloat(String(e.cantidad)) || 0) > 0;
              if (!ocupado) continue;
              var estado = (e.estado || 'liberado').toLowerCase();
              var count = p > 0 ? p : 1;
              if (estado === 'retenido') ret += count;
              else if (estado === 'rechazado') rej += count;
              else lib += count;
            }
            var vacio = totalRacks - ret - rej - lib;
            var total = totalRacks || 1;
            return { retenido: ret, rechazado: rej, liberado: lib, vacio: Math.max(0, vacio), pctRetenido: Math.round((ret / total) * 100), pctRechazado: Math.round((rej / total) * 100), pctLiberado: Math.round((lib / total) * 100), pctVacio: Math.round((Math.max(0, vacio) / total) * 100) };
          }
          if (pasillo === 'A' || pasillo === 'S') {
            var parentMap = {};
            for (var i = 0; i < zone.length; i++) {
              var e = zone[i];
              if (!parentMap[e.id]) parentMap[e.id] = [];
              parentMap[e.id].push(e);
            }
            var totalSubPositions = totalRacks;
            var occupiedCount = 0, ret = 0, rej = 0, lib = 0;
            for (var id in parentMap) {
              var parentEntries = parentMap[id];
              var acc = 0, parentCount = 0;
              for (var j = 0; j < parentEntries.length; j++) {
                var pe = parentEntries[j];
                var pp = parseFloat(String(pe.paletas)) || 0;
                if (pp <= 0) continue;
                var newAcc = acc + pp;
                var est = (pe.estado || 'liberado').toLowerCase();
                if (parentCount < 1 && acc < 1 && newAcc >= 1) {
                  if (est === 'retenido') ret++; else if (est === 'rechazado') rej++; else lib++;
                  parentCount++; occupiedCount++;
                }
                if (parentCount < 2 && acc < 2 && newAcc >= 2) {
                  if (est === 'retenido') ret++; else if (est === 'rechazado') rej++; else lib++;
                  parentCount++; occupiedCount++;
                }
                if (parentCount >= 2) break;
                acc = newAcc;
              }
            }
            var vacio = totalSubPositions - occupiedCount;
            var total = totalSubPositions || 1;
            return { retenido: ret, rechazado: rej, liberado: lib, vacio: Math.max(0, vacio), pctRetenido: Math.round((ret / total) * 100), pctRechazado: Math.round((rej / total) * 100), pctLiberado: Math.round((lib / total) * 100), pctVacio: Math.round((Math.max(0, vacio) / total) * 100) };
          }
          var rackStatus = {}, rackOccupied = {};
          for (var i = 0; i < zone.length; i++) {
            var e = zone[i];
            var ocupado = (parseFloat(String(e.paletas)) || 0) > 0 || (parseFloat(String(e.cantidad)) || 0) > 0;
            if (!ocupado) continue;
            rackOccupied[e.id] = true;
            var est = (e.estado || 'liberado').toLowerCase();
            var current = rackStatus[e.id];
            if (!current) rackStatus[e.id] = est;
            else if (current === 'liberado' && (est === 'retenido' || est === 'rechazado')) rackStatus[e.id] = est;
            else if (current === 'rechazado' && est === 'retenido') rackStatus[e.id] = est;
          }
          var occupiedRacks = Object.keys(rackOccupied).length;
          var ret = Object.values(rackStatus).filter(function(v) { return v === 'retenido'; }).length;
          var rej = Object.values(rackStatus).filter(function(v) { return v === 'rechazado'; }).length;
          var lib = Object.values(rackStatus).filter(function(v) { return v === 'liberado'; }).length;
          var vacio = totalRacks - occupiedRacks;
          var total = totalRacks || 1;
          return { retenido: ret, rechazado: rej, liberado: lib, vacio: Math.max(0, vacio), pctRetenido: Math.round((ret / total) * 100), pctRechazado: Math.round((rej / total) * 100), pctLiberado: Math.round((lib / total) * 100), pctVacio: Math.round((Math.max(0, vacio) / total) * 100) };
        },
        calculateAllZonesMetrics: function(entries, rackCounts) {
          var result = {};
          for (var zi = 0; zi < ['T', 'P'].length; zi++) {
            var zone = ['T', 'P'][zi];
            var test = zone === 'T' ? /^T\d{2}$/ : /^P\d{2}$/;
            var total = 0, used = 0;
            entries.forEach(function(e) {
              if (!test.test(e.id)) return;
              var p = parseFloat(String(e.paletas)) || 0;
              if (p > 0) { total += this.getEffectivePositions(e); used += p; }
              else if (parseFloat(String(e.cantidad)) > 0) { total += 1; used += 1; }
            });
            result[zone] = { total: total, used: used, empty: total - used, percent: total > 0 ? Math.round((used / total) * 100) : 0 };
          }
          for (var si = 0; si < [{zone: 'A', test: /^A\d{3}$/}, {zone: 'S', test: /^SQ\d{2}$/}].length; si++) {
            var spec = [{zone: 'A', test: /^A\d{3}$/}, {zone: 'S', test: /^SQ\d{2}$/}][si];
            var parentRacks = rackCounts[spec.zone] || 0;
            var total = parentRacks * 2;
            var parentMap = {};
            entries.forEach(function(e) { if (spec.test.test(e.id)) { if (!parentMap[e.id]) parentMap[e.id] = []; parentMap[e.id].push(e); } });
            var used = 0;
            for (var id in parentMap) {
              var pSum = parentMap[id].reduce(function(sum, e) { return sum + (parseFloat(String(e.paletas)) || 0); }, 0);
              used += Math.min(pSum, 2);
            }
            if (total === 0) total = Object.keys(parentMap).length * 2 || 1;
            result[spec.zone] = { total: total, used: used, empty: total - used, percent: total > 0 ? Math.round((used / total) * 100) : 0 };
          }
          for (var d = 1; d <= 9; d++) {
            var key = String(d);
            var total = rackCounts[key] || 0;
            var usedIds = {};
            entries.forEach(function(e) {
              if (e.id[0] === key && ((parseFloat(String(e.paletas)) || 0) > 0 || (parseFloat(String(e.cantidad)) || 0) > 0)) usedIds[e.id] = true;
            });
            result[key] = { total: total, used: Object.keys(usedIds).length, empty: total - Object.keys(usedIds).length, percent: total > 0 ? Math.round((Object.keys(usedIds).length / total) * 100) : 0 };
          }
          result['1-4'] = this.calcGroup(['1', '2', '3', '4'], entries, rackCounts);
          result['5-9'] = this.calcGroup(['5', '6', '7', '8', '9'], entries, rackCounts);
          return result;
        },
        calcGroup: function(digits, data, rackCounts) {
          var total = digits.reduce(function(sum, d) { return sum + (rackCounts[d] || 0); }, 0);
          var usedIds = {};
          data.forEach(function(e) {
            if (digits.includes(e.id[0]) && ((parseFloat(String(e.paletas)) || 0) > 0 || (parseFloat(String(e.cantidad)) || 0) > 0)) usedIds[e.id] = true;
          });
          var used = Object.keys(usedIds).length;
          return { total: total, used: used, empty: total - used, percent: total > 0 ? Math.round((used / total) * 100) : 0 };
        },

        loadModel: function(url) {
          return new Promise(function(resolve, reject) {

              var model = gltf.scene;
              model.traverse(function(child) {
                if (child.isMesh) this.processMesh(child);
              }.bind(this));
              this.scene.add(model);
              this.buildMeshByName();
              this.modelReady = true;
              this.onModelLoaded && this.onModelLoaded();
              resolve();
            }, undefined, function(err) { reject(err); });
          });
        },loadData: function() {

            .withSuccessHandler(function(data) {
              if (Array.isArray(data)) {
                var mapped = data.map(this.normalizeEntry).filter(function(e) { return e.id && this.isRackId(e.id); }.bind(this));
                this.State.setInventario(mapped);
                if (this.sceneManager && this.sceneManager.modelReady) {

        cargarInventarioJsonp: function(url, fallback) {
          var cb = 'jsonp_' + Date.now();

            delete window[cb];

              var mapped = data.map(this.normalizeEntry).filter(function(e) { return e.id && this.isRackId(e.id) });
              this.State.setInventario(mapped);
            } else if (fallback) {
              this.cargarInventarioFetch();
            }
          };
          var script = document.createElement('script');
          script.src = url + (url.indexOf('?') > -1 ? '&' : '?') + 'callback=' + cb + '&_=' + Date.now();
          script.onerror = function() {
            delete window[cb];
            if (fallback) this.cargarInventarioFetch();
          };
          var timeout = setTimeout(function() { if (window[cb]) {
              delete window[cb];

        var body = document.getElementById('zone-occupancy-body');
        body.innerHTML = '';
        var zoneDefs = [
          { label: 'Almacén Principal', class: 'zo-primary', data: z['1-4'] },
          { label: 'CAVA', class: 'zo-cava', data: z['5-9'] },
          { label: 'Tránsito', class: 'zo-t', data: z.T },
          { label: 'Formulación', class: 'zo-a', data: z.A },
          { label: 'Galpón Anexo', class: 'zo-p', data: z.P },
          { label: 'Jaula', class: 'zo-s', data: z.S }
        ];
        zoneDefs.forEach(function(it) {
          var div = document.createElement('div');
          div.className = 'zone-item ' + it.class;
          div.innerHTML =
            '<div class="zone-label-row"><span class="zone-label"><span class="zone-dot"></span>' + it.label + '</span><span class="zone-stats">' + it.data.used + '/' + it.data.total + ' (' + it.data.percent + '%)</span></div>' +
            '<div class="zone-bar"><div class="zone-bar-fill" style="width:' + it.data.percent + '%"></div></div>';
          body.appendChild(div);
        });
      };

      var renderZoneProducts = function() {
        var card = document.getElementById('zone-products-card'),
          pas = APPS.State.pasilloSeleccionado,
          data = APPS.State.datosInventario;
        if (pas === 'todos' || !data || data.length === 0) {
          card.style.display = 'none';
          return;
        }
        card.style.display = 'block';
        var zf;
        if (pas === 'T') zf = function(id) { return /^T\d{2}$/.test(id); }
        else if (pas === 'A') zf = function(id) { return /^A\d{3}$/.test(id); }
        else if (pas === 'P') zf = function(id) { return /^P\d{2}$/.test(id); }
        else if (pas === 'S') zf = function(id) { return /^SQ\d{2}$/.test(id); }
        else zf = function(id) { return id[0] === pas; };
        var filtered = data.filter(function(e) { return zf(e.id) && e.producto; });
        var groups = {};
        filtered.forEach(function(e) {
          var k = (e.codigo || '') + '|' + (e.producto || '');
          if (!groups[k]) {
            var es = (e.estado || 'liberado').toLowerCase();
            groups[k] = { producto: e.producto, codigo: e.codigo, paletas: 0, estado: es };
          }
          groups[k].paletas += parseFloat(String(e.paletas)) || 0;
          var es2 = (e.estado || 'liberado').toLowerCase();
          if (es2 === 'rechazado') groups[k].estado = 'rechazado';
          else if (es2 === 'retenido' && groups[k].estado !== 'rechazado') groups[k].estado = 'retenido';
        });
        var items = Object.values(groups).sort(function(a, b) { return b.paletas - a.paletas; }).slice(0, 10);
        var list = document.getElementById('zone-products-list');
        if (items.length === 0) {
          list.innerHTML = '<div class="stats-empty">Sin productos en esta zona</div>';
          return;
        }
        list.innerHTML = items.map(function(it) {
          return (
            '<div class="product-summary-row">' +
            '<span class="prod-name" title="' + escapeHtml(it.producto) + '">' + escapeHtml(it.producto) + '</span>' +
            '<span class="prod-qty">' + it.paletas + '</span>' +
            '<span class="badge-estado badge-' + it.estado + '">' + it.estado.substring(0, 3).toUpperCase() + '</span>' +
            '</div>'
          );
        }).join('');
      };

      var renderStatusProducts = function() {
        var card = document.getElementById('status-products-card'),
          sf = APPS.State.currentStatusFilter,
          data = APPS.State.datosInventario;
        if (!sf || !data || data.length === 0) {
          card.style.display = 'none';
          return;
        }
        card.style.display = 'block';
        document.getElementById('status-products-title').textContent = 'Productos ' + sf.charAt(0).toUpperCase() + sf.slice(1);
        var filtered = data.filter(function(e) { return (e.estado || '').toLowerCase() === sf && e.producto; });
        var groups = {};
        filtered.forEach(function(e) {
          var k = (e.codigo || '') + '|' + (e.producto || '');
          if (!groups[k]) groups[k] = { producto: e.producto, codigo: e.codigo, paletas: 0, ubicaciones: 0 };
          groups[k].paletas += parseFloat(String(e.paletas)) || 0;
          groups[k].ubicaciones++;
        });
        var items = Object.values(groups).sort(function(a, b) { return b.paletas - a.paletas; }).slice(0, 15);
        var list = document.getElementById('status-products-list');
        if (items.length === 0) {
          list.innerHTML = '<div class="stats-empty">Sin resultados</div>';
          return;
        }
        list.innerHTML = items.map(function(it) {
          return (
            '<div class="product-summary-row">' +
            '<span class="prod-name" title="' + escapeHtml(it.producto) + '">' + escapeHtml(it.producto) + '</span>' +
            '<span class="prod-qty">' + it.paletas + ' pal</span>' +
            '<span class="prod-ubics" style="font-size:10px;color:var(--md-text-muted)">' + it.ubicaciones + ' ub</span>' +
            '</div>'
          );
        }).join('');
      };

      var highlightSearchZones = function() {
        var t = APPS.State.searchQuery;
        document.querySelectorAll('.nav-btn[data-pasillo]').forEach(function(b) { b.classList.remove('has-matches'); });
        if (!t || !APPS.State.datosInventario) return;
        var q = t.toLowerCase().trim(), seen = {};
        APPS.State.datosInventario.forEach(function(e) {
          var a = (e.producto || '').toLowerCase(), c = (e.codigo || '').toLowerCase(), id = e.id || '', l = (e.lote || '').toLowerCase();
          if (!a.includes(q) && !c.includes(q) && !id.includes(q) && !l.includes(q)) return;
          var z;
          if (/^T\d{2}$/.test(id)) z = 'T';
          else if (/^A\d{3}$/.test(id)) z = 'A';
          else if (/^P\d{2}$/.test(id)) z = 'P';
          else if (/^SQ\d{2}$/.test(id)) z = 'S';
          else if (/^\d/.test(id)) z = id[0];
          if (z && !seen[z]) { seen[z] = true; var btn = document.querySelector('[data-pasillo="' + z + '"]'); if (btn) btn.classList.add('has-matches'); }
        });
      };

      var adjustPanelPositions = function() {
        var info = document.getElementById('info-panel'), stats = document.getElementById('stats-panel');
        info.style.top = stats.classList.contains('visible') ? (stats.offsetTop + stats.offsetHeight + 8 + 'px') : '20px';
      };

      // ─── RENDER MAIN ───────────────────────────────────────────────
      var renderAll = function() {
        renderKpis();
        renderPasilloButtons();
        renderDonut();
        renderTopProducts();
        renderInfoPanel();
        renderStatsPanel();
        renderZoneOccupancy();
        renderZoneProducts();
        renderStatusProducts();
        highlightSearchZones();
        adjustPanelPositions();
      };

      // ─── INITIALIZATION ───────────────────────────────────────────
      var init = function() {
        initMaterials();
        initSearch();
        initResetView();
        initReload();
        document.getElementById('usage-status-clear').addEventListener('click', function() {
          APPS.State.setStatusFilter(null);
          if (APPS.sceneManager) {
            APPS.sceneManager.currentStatusFilter = null;
            APPS.sceneManager.applySearchFilter();
          }
          renderAll();
        });

        var container = document.getElementById('scene-container');
        APPS.sceneManager = new APPS.SceneManager(container);
        APPS.sceneManager.onMeshClick = function(entries) {
          APPS.State.setSelectedRack(entries, entries[0] ? entries[0].id : null);
          renderAll();
        };
        APPS.sceneManager.onMeshLongPress = function(entries, productName, codigo) {
          var stats = APPS.computeProductStats(productName, codigo, APPS.State.datosInventario);
          if (stats) APPS.State.setProductStats(stats);
          renderAll();
        };
        APPS.sceneManager.onModelLoaded = function() {
          var data = APPS.State.datosInventario;
          if (data.length > 0) {
            APPS.sceneManager.updateSceneFromInventario(data);
            var counts = APPS.sceneManager.getRackCountsByZone();
            APPS.State.setRackCounts(counts);
            renderAll();
          }
          document.getElementById('reset-view-btn').style.display = 'block';
        };
        APPS.sceneManager.onLoaderUpdate = function(pct, show) {
          var progress = document.getElementById('loading-progress');
          if (show) progress.textContent = Math.round(pct * 100) + '%';
          else progress.textContent = '';
        };

        // Load model
        APPS.sceneManager.loadModel(CONFIG.modelUrl).then(function() {
          document.getElementById('loading-text').textContent = 'Cargando inventario...';
          APPS.loadData();
        }).catch(function(err) {
          document.getElementById('loading-text').textContent = 'Error al cargar el modelo 3D';
          document.getElementById('loading-progress').textContent = err.message || 'Error de conexión';
        });

        // Listen for state changes
        APPS.State.on('selection', renderAll);
        APPS.State.on('stats', renderAll);
        APPS.State.on('metrics', renderAll);
        APPS.State.on('viewMode', renderAll);

        // Initial render
        renderAll();
      };

      window.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
