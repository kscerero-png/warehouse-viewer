<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador Almacén Pesado</title>
    <style>
        body { margin: 0; background-color: #060b11; overflow: hidden; font-family: sans-serif; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #00ff9d; font-size: 18px; font-weight: bold; background: rgba(13, 22, 33, 0.9);
            padding: 20px 40px; border-radius: 8px; border: 1px solid #00ff9d;
            text-align: center; pointer-events: none; box-shadow: 0 0 20px rgba(0, 255, 157, 0.3);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loading">Iniciando descarga del modelo pesado...</div>

    <script>
        const MODEL_URL = "https://raw.githubusercontent.com/kscerero-png/warehouse-viewer/main/docs/almacen.glb";

        let scene, camera, renderer, controls;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060b11);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 30, 60);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(30, 50, 30);
            scene.add(sun);

            const loader = new THREE.GLTFLoader();

            loader.load(
                MODEL_URL,
                function (gltf) {
                    scene.add(gltf.scene);
                    document.getElementById('loading').style.display = 'none';
                    console.log("¡Modelo cargado con éxito!");
                },
                function (xhr) {
                    if (xhr.total) {
                        const porcentaje = Math.round((xhr.loaded / xhr.total) * 100);
                        document.getElementById('loading').innerText = `Descargando estructura: ${porcentaje}%`;
                    } else {
                        const mbDescargados = (xhr.loaded / (1024 * 1024)).toFixed(1);
                        document.getElementById('loading').innerText = `Descargando: ${mbDescargados} MB...`;
                    }
                },
                function (error) {
                    console.error("Error de carga:", error);
                    document.getElementById('loading').innerText = "Error al cargar el modelo.";
                    document.getElementById('loading').style.color = "#ff4a4a";
                }
            );

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>
